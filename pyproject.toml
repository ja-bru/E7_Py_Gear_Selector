[project]
name = "e7-py-gear-selector"
version = "0.1.0"
description = "Equipment selection and hero optimization for Epic Seven"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pandas>=1.3.0",
    "numpy>=1.20.0",
    "pyyaml>=5.4",
    "requests>=2.25.0",
    "ipywidgets>=7.6.0",
]

[project.optional-dependencies]
notebook = ["jupyter>=1.0.0"]
dev = ["pytest>=7.0"]
gui = ["pyside6>=6.5"]

[project.scripts]
e7-gear-gui = "gui.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["gui*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["prog"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
